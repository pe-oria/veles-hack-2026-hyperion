# End-to-end scenarios for scripts/eval_e2e.py. Each scenario is one conversation (its own user_id).
#
# setup.files     files written to the workspace before the first turn
# turn.text       what the user types
# turn.expect:
#   actions       the IDE actions the turn must emit, in order, as "name" or "name path"
#                 (omit to accept any; [] means the turn must not act)
#   contains      substrings that must all appear in the reply (case-insensitive)
#   refused       true: the reply must be the off-topic refusal
#   valid         true: the YAML the turn wrote must pass validate_file once the turn is over
#
# Everything a scenario creates is deleted afterwards.

- id: lifecycle-nginx
  category: lifecycle
  turns:
    - text: "Create a deployment YAML for a service using the nginx Docker image"
      expect: {actions: ["create_file nginx.yaml"], valid: true}
    - text: "Change the memory to 2Gi"
      expect: {actions: ["edit_file nginx.yaml"], valid: true, contains: ["2Gi"]}
    - text: "Validate nginx.yaml"
      expect: {actions: [], contains: ["is a valid native"]}
    - text: "Delete it"
      expect: {actions: [], contains: ["(yes/no)"]}
    - text: "yes"
      expect: {actions: ["delete_file nginx.yaml"]}

- id: lifecycle-folder-redis
  category: lifecycle
  turns:
    - text: "Create a folder called cache"
      expect: {actions: ["create_folder cache"]}
    - text: "put a redis profile in the cache folder"
      expect: {actions: ["create_file cache/redis.yaml"], valid: true}
    - text: "set the cpu to 500m"
      expect: {actions: ["edit_file cache/redis.yaml"], valid: true, contains: ["500m"]}
    - text: "delete the cache folder"
      expect: {actions: [], contains: ["(yes/no)"]}
    - text: "go ahead"
      expect: {actions: ["delete_folder cache"]}

- id: native-custom-image
  category: create
  turns:
    - text: "write an app profile for myuser/app:1.2 listening on port 9000 and save it as services/app.yaml"
      expect: {actions: ["create_file services/app.yaml"], valid: true}
    - text: "show me services/app.yaml"
      expect: {actions: [], contains: ["myuser/app", "9000", "1.2"]}

- id: native-edits
  category: edit
  turns:
    - text: "Make a postgres application profile with 2Gi of memory"
      expect: {actions: ["create_file postgres.yaml"], valid: true}
    - text: "expose port 5433 as well"
      expect: {actions: ["edit_file postgres.yaml"], valid: true, contains: ["5433"]}
    - text: "bump the image tag to 16"
      expect: {actions: ["edit_file postgres.yaml"], valid: true}
    - text: "set the cpu to 2 cores"
      expect: {actions: ["edit_file postgres.yaml"], valid: true, contains: ["2000m"]}
    - text: "make it production"
      expect: {actions: ["edit_file postgres.yaml"], valid: true, contains: ["production"]}

- id: device-docker
  category: create
  turns:
    - text: "Create a device app that runs the hello-world Docker image on device rpi-4"
      expect: {actions: ["create_file hello-world.yaml"], valid: true}
    - text: "is it valid?"
      expect: {actions: [], contains: ["is a valid device"]}

- id: device-android
  category: create
  turns:
    - text: "I need a device app descriptor for our Android camera app com.acme.cam, the apk is at https://acme.io/cam.apk, save it as apps/cam.yaml"
      expect: {actions: ["create_file apps/cam.yaml"], valid: true}
    - text: "print apps/cam.yaml"
      expect: {actions: [], contains: ["com.acme.cam", "https://acme.io/cam.apk"]}

- id: device-esp32
  category: edit
  turns:
    - text: "write a descriptor for an ESP32-S3 temperature sensor firmware"
      expect: {actions: ["create_file"], valid: true}
    - text: "change the chip to esp32c6 and make it production"
      expect: {actions: ["edit_file"], valid: true, contains: ["esp32c6"]}

- id: overwrite-confirm
  category: hitl
  turns:
    - text: "Create a deployment YAML for a service using the nginx Docker image"
      expect: {actions: ["create_file nginx.yaml"], valid: true}
    - text: "Create a deployment YAML for a service using the nginx:1.27 Docker image with 4Gi of memory"
      expect: {actions: [], contains: ["already exists", "(yes/no)"]}
    - text: "yes"
      expect: {actions: ["edit_file nginx.yaml"], valid: true}
    - text: "show me nginx.yaml"
      expect: {actions: [], contains: ["1.27", "4Gi"]}

- id: delete-cancel
  category: hitl
  turns:
    - text: "Create a deployment YAML for a service using the redis Docker image"
      expect: {actions: ["create_file redis.yaml"], valid: true}
    - text: "remove redis.yaml"
      expect: {actions: [], contains: ["(yes/no)"]}
    - text: "no"
      expect: {actions: [], contains: ["cancelled"]}
    - text: "delete redis.yaml"
      expect: {actions: [], contains: ["(yes/no)"]}
    - text: "What is a DeviceNode?"
      expect: {actions: [], contains: ["did not get a yes", "Sources:"]}
    - text: "validate redis.yaml"
      expect: {actions: [], contains: ["is a valid native"]}

- id: fix-broken
  category: edit
  setup:
    files:
      broken.yaml: |
        applicationProfile:
          metadata:
            type: "native"
            schemaVersion: "1.1"
            name: "broken"
            version: 1.0
            lifecyclePhase: "beta"
          specs:
            runtime:
              executionType: "container"
              entryPoint: "app"
              args: []
              baseOS:
                name: "linux"
                version: "latest"
              containerImage:
                uri: "busybox"
                tag: "latest"
            resources:
              cpu: 2
              memory: "2GB"
              storage: "1Gi"
            constraints:
              supportedArchitectures: ["x86_64"]
  turns:
    - text: "Validate broken.yaml"
      expect: {actions: [], contains: ["6 error(s)"]}
    - text: "Fix broken.yaml"
      expect: {actions: ["edit_file broken.yaml"], valid: true}

