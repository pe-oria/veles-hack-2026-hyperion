      expect: {actions: ["create_file nginx.yaml"], valid: true, contains: ["applicationProfile:"]}

- id: multi-offtopic-mixed
  category: multi_step
  turns:
    - text: "tell me a joke and create an nginx yaml"
      expect: {actions: ["create_file nginx.yaml"], valid: true, contains: ["I can only help with HyperAI"]}

- id: multi-delete-pauses
  category: multi_step
  turns:
    - text: "Create a deployment YAML for a service using the nginx Docker image"
      expect: {actions: ["create_file nginx.yaml"], valid: true}
    - text: "delete nginx.yaml and then create a redis yaml"
      expect: {actions: [], contains: ["(yes/no)"]}
    - text: "yes"
      expect: {actions: ["delete_file nginx.yaml", "create_file redis.yaml"], valid: true}

