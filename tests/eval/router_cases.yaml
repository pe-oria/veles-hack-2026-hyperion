- {id: c-introduce, category: conversation, split: test, text: "For the record, I'm Lena and I work on the gateway team of our HyperAI pilot.", expect: {intent: question, about_conversation: true}}
- id: c-last-created
  category: conversation
  split: test
  history: &nginx [["Create a deployment YAML for a service using the nginx Docker image", "Creating nginx.yaml - a native application profile for nginx:latest."]]
  text: "what was the last thing you made for me?"
  expect: {intent: question, about_conversation: true}

