# Router evaluation set. `dev` may be used to tune prompts; `test` is held out:
# never copy a test case (or a near-paraphrase of one) into prompts.ROUTER_EXAMPLES.
#
# expect.intent        the route the pipeline must act on (router + guardrail)
# expect.<slot>        strings match as a case-insensitive prefix, booleans exactly
# expect.intents       for multi-step requests: the intents of the steps, in order
#
# history is a list of [user, assistant] pairs.

# --- question ---------------------------------------------------------------------------------
- {id: q-hyperai, category: question, split: dev, text: "What is HyperAI?", expect: {intent: question, about_conversation: false}}
- {id: q-connectors, category: question, split: dev, text: "What are Open Connectors?", expect: {intent: question}}
- {id: q-devicenode, category: question, split: dev, text: "What is a DeviceNode?", expect: {intent: question}}
- {id: q-architecture, category: question, split: dev, text: "Explain the high level architecture of the platform", expect: {intent: question}}
- {id: q-native-fields, category: question, split: dev, text: "Which fields are required in a native application profile?", expect: {intent: question}}
- {id: q-d43, category: question, split: dev, text: "What does deliverable D4.3 cover?", expect: {intent: question}}
- id: q-followup-methodology
  category: question
  split: dev
  history: [["What is HyperAI?", "HyperAI is an EU project."]]
  text: "Tell me more about its methodology"
  expect: {intent: question}
- id: q-devicenode-after-facts
  category: question
  split: dev
  history: &falcon
    - ["We are team Falcon and our HyperAI app is named sky-watch", "Noted."]
    - ["What are Open Connectors?", "Open Connectors manage edge devices as cloud nodes."]
  text: "What is a DeviceNode?"
  expect: {intent: question, about_conversation: false}
- {id: q-followup-registered, category: question, split: dev, history: *falcon, text: "and how are they registered?", expect: {intent: question, about_conversation: false}}
- {id: q-first-webserver, category: question, split: dev, text: "How do I deploy my first web server?", expect: {intent: question, about_conversation: false}}
- {id: q-goal, category: question, split: test, text: "Could you describe what the HYPER-AI project is trying to achieve?", expect: {intent: question}}
- {id: q-d33-summary, category: question, split: test, text: "Give me a summary of D3.3", expect: {intent: question}}
- {id: q-device-qos, category: question, split: test, text: "In a device manifest, what goes under spec.qos?", expect: {intent: question}}
- {id: q-start-workflow, category: question, split: test, text: "how do I start a workflow in the IDE?", expect: {intent: question}}
- {id: q-native-vs-device, category: question, split: test, text: "What's the difference between a native app and a device app?", expect: {intent: question}}
- id: q-followup-hardware
  category: question
  split: test
  history: [["What are Open Connectors?", "Open Connectors manage edge devices as cloud nodes."]]
  text: "what kind of hardware can those handle?"
  expect: {intent: question, about_conversation: false}
- {id: q-registries, category: question, split: test, text: "Which registries am I allowed to pull container images from?", expect: {intent: question}}

# --- conversation -----------------------------------------------------------------------------
