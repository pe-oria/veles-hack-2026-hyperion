[project]
name = "hyperion"
version = "0.1.0"
description = "Hyperion — an agentic microservice for the HyperAI IDE"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28.1",
    "langchain-openai>=1.6.1",
    "numpy>=2.5.3",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "uvicorn>=0.34",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
